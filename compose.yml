---
version: "3.9"
services:
 devopsdb:
   image: dommeti/automation:db
   ports:
     - "3306:3306"
   deploy:
      replicas: 3
  networks:
     - mynetwork

 application:
   image: dommeti/automation:app
   ports:
     - "1111:8080"
   deploy:
      replicas: 3
   depends_on:
     - "devopsdb"
   networks:
     - mynetwork

networks:
 mynetwork:
  driver: overlay
